services:
  postgres:
    image: postgres:16-alpine
    container_name: prayers4me-postgres
    environment:
      POSTGRES_USER: prayers4me
      POSTGRES_PASSWORD: prayers4me
      POSTGRES_DB: prayers4me
    ports:
      - "5432:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prayers4me -d prayers4me"]
      interval: 5s
      timeout: 5s
      retries: 10
